# Builds the public edition and publishes it to GitHub Pages.
#
# The public edition has no backend and no accounts: it is static files plus
# a snapshot of public market quotes. Nothing personal is built or published.
#
# To turn the site on: repository Settings → Pages → Source: GitHub Actions.
# Until then the deploy step fails and nothing is published.

name: Publish public edition

on:
  push:
    branches: [main]
  schedule:
    # Refresh the quote snapshot every 30 minutes.
    - cron: '7,37 * * * *'
  workflow_dispatch:

# Nothing gets more than read access unless a job asks for it below.
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to the commit behind each release tag.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # The privacy check reads every commit, not just the latest.
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check:privacy -- --history
      - run: npm test
      - run: npm run build:public
        env:
          # The members' Apps Script address: a repository variable, never
          # committed. Without it the site is the calculator only.
          VITE_EXFOLIO_GAS_URL: ${{ vars.EXFOLIO_GAS_URL }}
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: dist

  # Browser tests and the accessibility audit gate a deployment from a push.
  # The half-hourly quote refresh changes no code, so it skips them.
  browser:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  deploy:
    needs: [build, browser]
    # Runs when the browser tests passed, or were skipped on a schedule.
    if: >-
      always() && needs.build.result == 'success' &&
      (needs.browser.result == 'success' || needs.browser.result == 'skipped')
    runs-on: ubuntu-latest
    # Only this job, which runs no repository code, may publish.
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
