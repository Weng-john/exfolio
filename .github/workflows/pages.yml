# Builds the public edition and publishes it to GitHub Pages.
#
# The public edition has no backend and no accounts: it is static files plus
# a snapshot of public market quotes. Nothing personal is built or published.
#
# To turn the site on: repository Settings → Pages → Source: GitHub Actions.
# Until then the deploy step fails and nothing is published.

name: Publish public edition

on:
  push:
    branches: [main]
  schedule:
    # Refresh the quote snapshot every 30 minutes.
    - cron: '7,37 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check:privacy
      - run: npm test
      - run: npm run build:public
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
